services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    image: ${DOCKERHUB_USERNAME}/fullstack-backend:latest
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017/appdb
    depends_on:
      - mongo

  frontend:
    image: ${DOCKERHUB_USERNAME}/fullstack-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: